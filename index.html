<body>

   <div id="game">
      <canvas id="xxx" width="1366" height="768" onclick="this.requestPointerLock()"></canvas>

      <div id="interface">

         <div id="score">
            Zdobyte punkty: XXX
         </div>

         <div id="main-menu">
            <div class="overlay">
               <div class="main-menu-content">
                  <div class="space" style="margin-top: 70%;"></div>
                  <input type="button" value="Graj"
                     onclick="Scene.Instance.EventManager.riseEvent('OnContinue', null);" />
                  <hr />
                  <input type="button" value="Sterowanie"
                     onclick="document.querySelector('#controls').style.display ='block'">
                  <hr />
                  <input type="button" value="Ustawienia"
                     onclick="document.querySelector('#settings').style.display ='block'; refreshSetting ()">
               </div>
            </div>
         </div>

         <div id="settings" style="display: none;">
            <div class="overlay">
               <div class="default-ingame-window">
                  <h1>Ustawienia</h1>
                  <div>
                     Czułość myszki
                     <label>
                        <input type="range" min="50" max="250" value="100" step="10" id="settings-sensitivity">
                        <p id="settings-sensitivity-value">20%</p>
                     </label>
                  </div>

                  <div>
                     Odległość rysowania
                     <label>
                        <input type="range" min="3" max="10" value="5" step="1" id="settings-render-distance">
                        <p id="settings-render-distance-value">5</p>
                     </label>
                  </div>
                  <p style="margin-top: auto; font-size: 12px;">
                     Ustawienia korzystają z cookies.
                  </p>
                  <input style="width: 80%; margin-bottom: 50px;" type="button" value="Zamknij"
                     onclick="document.querySelector('#settings').style.display ='none'">
               </div>
            </div>
         </div>

         <div id="version">
            Wersja: 0.1.0
         </div>
      </div>

   </div>
   <footer>Kewin Ignasiak 2024</footer>

   <script src="src/game/PlayableScene.js"></script>
   <script>

      const DOM_SensitivitySlider = document.querySelector('#settings-sensitivity');
      const DOM_SensitivityValue = document.querySelector('#settings-sensitivity-value');

      const DOM_RenderDistanceSlider = document.querySelector('#settings-render-distance');
      const DOM_RenderDistanceValue = document.querySelector('#settings-render-distance-value');

      const updateSensitivityValue = () => {

         const value = DOM_SensitivitySlider.value;
         DOM_SensitivityValue.innerText = value + '%';

         Settings.SetValue(Settings.MOUSE_SENSITIVITY, value);
      }

      const updateRenderDistanceValue = () => {

         const value = DOM_RenderDistanceSlider.value;
         DOM_RenderDistanceValue.innerText = value;

         Settings.SetValue(Settings.RENDER_DISTANCE, value);
      }

      DOM_SensitivitySlider.onchange = updateSensitivityValue;
      DOM_RenderDistanceSlider.onchange = updateRenderDistanceValue;

      const refreshSetting = () => {

         const mouseSensitivity = Settings.GetValueAsString(Settings.MOUSE_SENSITIVITY);

         if (mouseSensitivity !== undefined)
            DOM_SensitivitySlider.value = mouseSensitivity;

         updateSensitivityValue();

         const renderDistance = Settings.GetValueAsString(Settings.RENDER_DISTANCE);

         if (renderDistance !== undefined)
            DOM_RenderDistanceSlider.value = renderDistance;

         updateRenderDistanceValue();
      }

      {
         let isMenuShown = true;

         document.addEventListener('pointerlockchange', data => {
            if (document.pointerLockElement !== xxx) {

               isMenuShown = true;
               updateMenuState();
            }

         });

         const updateMenuState = () => {

            if (isMenuShown)
               Scene.Instance.InputManager.blockInput();
            else
               Scene.Instance.InputManager.unblockInput();
            document.querySelector("#main-menu").style.display = isMenuShown ? 'inline-flex' : 'none';
         }

         Scene.Instance.EventManager.addEventListener("OnContinue", () => {
            isMenuShown = false;
            updateMenuState();
            document.querySelector('canvas').requestPointerLock();
         })

         updateMenuState();
      }


      Scene.Instance.Start();
   </script>
</body>
